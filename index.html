<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d48c9">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Simulado Vestibulinho Etec</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Layout: folha de prova numa coluna só, uma questão por tela, cartão-resposta como grade de bolinhas */
:root{
  --bg:#eef1f6;--surface:#fff;--ink:#16202e;--muted:#566275;--line:#d6dce6;
  --pen:#1d48c9;--pen-soft:#e3eafc;--ok:#18794a;--ok-soft:#e1f3e9;--bad:#b3261e;--bad-soft:#fbe5e3;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Lexend",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a;--surface:#171c26;--ink:#e7ebf2;--muted:#9aa4b6;--line:#2b3442;
  --pen:#86a2ff;--pen-soft:#1f2a47;--ok:#58c88c;--ok-soft:#163325;--bad:#ff8a80;--bad-soft:#3a1d1b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a;--surface:#171c26;--ink:#e7ebf2;--muted:#9aa4b6;--line:#2b3442;
  --pen:#86a2ff;--pen-soft:#1f2a47;--ok:#58c88c;--ok-soft:#163325;--bad:#ff8a80;--bad-soft:#3a1d1b;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
h1,h2{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem}h2{font-size:1.4rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.facts div{background:var(--bg);border-radius:10px;padding:10px 12px}
.facts dt{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
label{font-weight:500}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--pen);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
/* barra da prova */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.clock{font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;background:var(--pen);transition:width .2s}
.qnum{font-family:var(--display);font-size:1.1rem}
.area{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pen);background:var(--pen-soft);border-radius:99px;padding:3px 10px;font-weight:600}
.texto{white-space:pre-line;border-left:3px solid var(--line);padding-left:14px;color:var(--ink);font-size:.98rem}
.fonte{font-size:.8rem;color:var(--muted)}
.alts{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
.alt .b{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.alt[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.alt[aria-pressed="true"] .b{background:var(--pen);border-color:var(--pen);color:var(--surface)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px}
.nav .btn{flex:1}
/* cartão-resposta */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 0;font-variant-numeric:tabular-nums;font-size:.9rem}
.cell.on{background:var(--pen-soft);border-color:var(--pen);font-weight:600}
.cell.cur{outline:2px solid var(--ink)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok)}.cell.no{background:var(--bad-soft);border-color:var(--bad)}
.warn{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:14px}
.big{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td:last-child,th:last-child{text-align:right}
.rev{border-top:1px solid var(--line);padding-top:12px}
.tag{font-weight:600}.tag.ok{color:var(--ok)}.tag.no{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px}
/* treino por matéria */
.alt.certa{border-color:var(--ok);background:var(--ok-soft)}
.alt.errada{border-color:var(--bad);background:var(--bad-soft)}
.alt.certa .b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.alt.errada .b{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.alt:disabled{cursor:default;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.treina{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font-weight:600}
.treina .sub{font-size:.75rem;font-weight:400}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--pen-soft);border-color:var(--pen);color:var(--pen);font-weight:600}
@media (min-width:560px){.facts{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(10,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const AREAS={LP:"Língua Portuguesa",MAT:"Matemática",CN:"Ciências da Natureza",HIS:"História",GEO:"Geografia",CID:"Cidadania e cotidiano"};
const T_CIDA="Dona Cida acorda antes do sol. Passa o café, confere a marmita e sai para o ponto ainda de chinelo, com o sapato na sacola. Diz que é para não gastar a sola na ladeira. No ônibus, troca o calçado, ajeita o cabelo no reflexo da janela e, quando desce na avenida, ninguém imagina a ladeira que ela subiu.";
const T_AVISO="Prezados moradores,\nInformamos que, devido à manutenção da bomba d'água, o abastecimento será interrompido na quinta-feira, das 8h às 14h. Recomendamos que armazenem água para o período.\nA Administração";
const T_POEMA="A cidade dorme de olhos abertos:\njanelas acesas,\nsirenes que cantam sem melodia,\ne um gato que atravessa a rua\ncomo quem não deve nada a ninguém.";
const T_FEIRA="Seu Antônio monta a barraca de frutas às cinco da manhã. Arruma as laranjas em pirâmide, borrifa água nas folhas de couve e, quando o primeiro freguês chega, já sabe de cor o que ele vai pedir.\n— Duas bananas-prata e um conselho — diz o freguês, rindo.\nSeu Antônio responde que o conselho, hoje, está em promoção: de graça.";
const T_BIBLIO="A biblioteca estará fechada para reforma de 3 a 14 de março.\nOs livros emprestados poderão ser devolvidos na secretaria da escola, de segunda a sexta, das 9h às 11h.\nContamos com a colaboração de todos.\nA Direção";
const T_CICLO="PREFEITURA INAUGURA CICLOVIA DE 8 KM NA ZONA LESTE\nA nova ciclovia liga o terminal de ônibus ao parque da cidade e já recebe, segundo a prefeitura, cerca de 400 ciclistas por dia. A obra custou R$ 2 milhões e levou seis meses para ser concluída.";
const T_CELULAR="CELULAR NA SALA DE AULA: AJUDA OU ATRAPALHA?\nPara muitos professores, o aparelho dispersa a atenção da turma. Mas, quando usado para pesquisas e consultas ao dicionário, ele se transforma em um aliado do aprendizado. O problema, portanto, não está no celular, e sim na maneira como ele é usado.";
const T_ENQUETE="Como os alunos vão à escola\n(enquete com 200 estudantes)\nÔnibus: 90 alunos\nA pé: 60 alunos\nBicicleta: 30 alunos\nCarro: 20 alunos";
const T_CHUVA="Chove lá fora\ne a casa encolhe.\nCada gota é um relógio\ncontando o tempo\nque não quer passar.";
const T_RECEITA="Misture a farinha com o leite. Acrescente os ovos e bata bem. Leve ao forno por 30 minutos.";
const T_PADARIA="Pães vendidos em uma padaria\nSegunda: 150\nTerça: 200\nQuarta: 250\nQuinta: 200\nSexta: 200";
const T_PLANOS="Plano A: R$ 50,00 fixos + R$ 0,50 por minuto de ligação\nPlano B: R$ 80,00 fixos, com ligações ilimitadas";
const BANCO=[
{a:"LP",t:T_CIDA,f:"Texto escrito para este simulado.",q:"No contexto, a expressão final “ninguém imagina a ladeira que ela subiu” faz referência",o:["apenas ao caminho de terra perto da casa de Dona Cida.","ao esforço diário e às dificuldades da personagem, que não aparecem para quem a vê na avenida.","à falta de interesse de Dona Cida pelo trabalho.","ao cansaço provocado somente pela viagem de ônibus.","à vaidade da personagem, preocupada só com a aparência."],c:1,e:"Sentido figurado: a “ladeira” representa a rotina difícil que ninguém vê."},
{a:"LP",t:T_CIDA,q:"A atitude de levar o sapato na sacola e ir de chinelo até o ponto revela, principalmente,",o:["pressa para não perder o ônibus.","descuido com a própria aparência.","preocupação em economizar e conservar o calçado.","desconforto com o sapato novo.","medo de escorregar na ladeira."],c:2,e:"O próprio texto explica: “para não gastar a sola”."},
{a:"LP",t:T_AVISO,q:"Na frase “devido à manutenção da bomba d'água”, a expressão destacada introduz uma ideia de",o:["finalidade.","causa.","oposição.","condição.","comparação."],c:1,e:"“Devido a” = por causa de. A manutenção é a causa da interrupção."},
{a:"LP",t:T_AVISO,q:"O principal objetivo desse texto é",o:["narrar um fato imaginário.","convencer o leitor a comprar um produto.","expressar os sentimentos do autor.","informar uma situação e orientar os moradores sobre como agir.","defender uma opinião pessoal."],c:3,e:"É um comunicado: informa (falta d'água) e orienta (armazenar água)."},
{a:"LP",t:"— vc vem hj?\n— blz, tô saindo agora. chego em 10 min",f:"Conversa em aplicativo de mensagens.",q:"Sobre a linguagem usada nessa conversa, é correto afirmar que",o:["está errada e deve ser evitada em qualquer situação.","é própria de documentos oficiais.","mostra que os falantes não conhecem a norma-padrão.","é inadequada porque usa abreviações.","é adequada ao contexto informal e à rapidez da comunicação digital."],c:4,e:"Variação linguística: a adequação depende do contexto, não existe “erro” aqui."},
{a:"LP",q:"Assinale a alternativa em que o acento grave (crase) foi usado corretamente.",o:["Fui à pé até o trabalho.","Entreguei o documento à ela.","Amanhã cedo vou à feira do bairro.","Começou à chover forte.","Assisti à dois filmes ontem."],c:2,e:"“Ir a + a feira”. Não há crase antes de palavra masculina, pronome pessoal, verbo ou numeral."},
{a:"LP",q:"Assinale a frase que está de acordo com a norma-padrão da língua portuguesa.",o:["Faz três meses que não chove na região.","Houveram muitas reclamações na reunião.","Existe muitas pessoas na fila do posto.","Sobrou poucas vagas para o curso.","Fazem dois anos que me mudei."],c:0,e:"“Fazer” indicando tempo e “haver” no sentido de existir não vão para o plural."},
{a:"LP",t:"VENDE-SE CADEIRA PARA SENHORA COM PERNAS QUEBRADAS.\nTratar com Sr. Jorge.",f:"Anúncio de classificados (adaptado).",q:"O anúncio provoca humor porque",o:["usa palavras estrangeiras.","apresenta erro de ortografia.","é ambíguo: não fica claro se as pernas quebradas são da cadeira ou da senhora.","exagera o valor do produto.","não informa como falar com o vendedor."],c:2,e:"Ambiguidade causada pela posição do termo “com pernas quebradas”."},
{a:"LP",t:T_POEMA,f:"Poema escrito para este simulado.",q:"No verso “A cidade dorme de olhos abertos”, a figura de linguagem predominante é a",o:["hipérbole, pois há exagero intencional.","metonímia, pois troca a parte pelo todo.","personificação, pois atribui ações humanas a algo não humano.","onomatopeia, pois imita um som.","antítese, pois apresenta ideias opostas."],c:2,e:"Cidade não dorme nem tem olhos: personificação (prosopopeia)."},
{a:"LP",t:T_POEMA,q:"No último verso, a comparação “como quem não deve nada a ninguém” sugere que o gato atravessa a rua com",o:["medo e desconfiança.","tranquilidade e despreocupação.","pressa e agitação.","tristeza e solidão.","raiva dos carros."],c:1,e:"Quem “não deve nada” anda sem preocupação."},
{a:"LP",t:"Doe sangue.\nVocê não vê quem ajuda, mas alguém vai ver você como herói.",f:"Campanha publicitária (texto criado para o simulado).",q:"O uso do verbo “Doe”, no modo imperativo, tem a função de",o:["descrever uma ação do passado.","expressar dúvida sobre a doação.","relatar um fato científico.","criticar quem não doa sangue.","convidar e persuadir o leitor a agir."],c:4,e:"Imperativo em campanhas = apelo direto ao leitor."},
{a:"LP",t:"Após uma semana de protestos dos moradores, a medida que aumentava a tarifa do ônibus foi revogada pela prefeitura.",q:"No texto, a palavra “revogada” pode ser substituída, sem mudança de sentido, por",o:["anulada.","aprovada.","adiada.","ampliada.","publicada."],c:0,e:"Revogar = tornar sem efeito, anular."},
{a:"MAT",t:"Promoção do mercado: iogurte a R$ 4,50 a unidade. LEVE 3, PAGUE 2.",q:"Uma pessoa levou 6 iogurtes aproveitando a promoção. Ela pagou",o:["R$ 27,00.","R$ 22,50.","R$ 18,00.","R$ 13,50.","R$ 9,00."],c:2,e:"6 iogurtes = 2 grupos de 3; paga 4 × 4,50 = R$ 18,00."},
{a:"MAT",q:"Um trabalhador recebia R$ 2.400,00 e teve um reajuste de 5%. Seu novo salário passou a ser",o:["R$ 2.405,00.","R$ 2.450,00.","R$ 2.500,00.","R$ 2.520,00.","R$ 2.640,00."],c:3,e:"5% de 2.400 = 120; 2.400 + 120 = 2.520."},
{a:"MAT",q:"Em um mapa feito na escala 1 : 500 000, a distância entre duas cidades é de 4 cm. A distância real entre elas é de",o:["2 km.","20 km.","200 km.","0,2 km.","50 km."],c:1,e:"4 × 500 000 = 2 000 000 cm = 20 km."},
{a:"MAT",q:"O piso de uma cozinha retangular de 3 m por 4 m será coberto com placas quadradas de 50 cm de lado. Sem considerar perdas, serão necessárias",o:["12 placas.","24 placas.","48 placas.","60 placas.","96 placas."],c:2,e:"Área = 12 m²; cada placa 0,5 × 0,5 = 0,25 m²; 12 ÷ 0,25 = 48."},
{a:"MAT",t:"Consumo de água de uma casa\nJaneiro: 18 m³\nFevereiro: 15 m³\nMarço: 21 m³\nAbril: 18 m³",q:"A média mensal de consumo de água nesses quatro meses foi de",o:["15 m³.","16 m³.","17 m³.","18 m³.","21 m³."],c:3,e:"(18+15+21+18) ÷ 4 = 72 ÷ 4 = 18."},
{a:"MAT",q:"Quatro pedreiros, trabalhando no mesmo ritmo, constroem um muro em 6 dias. Com apenas 3 pedreiros, no mesmo ritmo, o muro ficará pronto em",o:["8 dias.","4 dias.","4,5 dias.","7 dias.","9 dias."],c:0,e:"Grandezas inversas: 4 × 6 = 24 dias de trabalho; 24 ÷ 3 = 8."},
{a:"MAT",q:"Em uma urna há 3 bolas vermelhas, 5 azuis e 2 verdes, todas iguais no tamanho. Retirando uma bola ao acaso, a chance de ela ser azul é de",o:["5%.","20%.","25%.","30%.","50%."],c:4,e:"5 azuis em 10 bolas = 5/10 = 50%."},
{a:"MAT",q:"Marta tem o triplo da idade do filho. Somando as duas idades, o resultado é 48 anos. A idade de Marta é",o:["12 anos.","24 anos.","32 anos.","36 anos.","40 anos."],c:3,e:"x + 3x = 48 → x = 12 (filho); Marta = 36."},
{a:"MAT",q:"Uma pessoa pegou R$ 1.000,00 emprestados a juros simples de 2% ao mês, por 5 meses. Ao final, ela pagará, no total,",o:["R$ 1.010,00.","R$ 1.020,00.","R$ 1.100,00.","R$ 1.200,00.","R$ 2.000,00."],c:2,e:"Juros = 1.000 × 0,02 × 5 = 100; total 1.100."},
{a:"MAT",t:"Celular\nÀ vista: R$ 1.200,00\nA prazo: 10 parcelas de R$ 138,00",q:"Comprando a prazo, o cliente pagará a mais, em relação ao preço à vista,",o:["10%.","15%.","18%.","20%.","38%."],c:1,e:"10 × 138 = 1.380; diferença 180; 180 ÷ 1.200 = 15%."},
{a:"MAT",q:"Uma caixa-d'água tem formato de bloco retangular com medidas internas de 2 m de comprimento, 1,5 m de largura e 1 m de altura. Sabendo que 1 m³ = 1.000 litros, a capacidade da caixa é de",o:["300 litros.","450 litros.","3.000 litros.","4.500 litros.","30.000 litros."],c:2,e:"2 × 1,5 × 1 = 3 m³ = 3.000 L."},
{a:"MAT",t:"Tarifa de táxi\nBandeirada: R$ 5,50\nPreço por quilômetro rodado: R$ 3,00",q:"Uma corrida custou R$ 32,50. A distância percorrida foi de",o:["9 km.","8 km.","10 km.","11 km.","12 km."],c:0,e:"32,50 − 5,50 = 27; 27 ÷ 3 = 9 km."},
{a:"CN",q:"Uma roupa molhada estendida no varal fica seca depois de algumas horas. A mudança de estado físico que explica esse fato é a",o:["fusão.","solidificação.","condensação.","evaporação.","sublimação."],c:3,e:"A água líquida passa para vapor: evaporação."},
{a:"CN",q:"Ao servir um refrigerante bem gelado em um copo de vidro, logo aparecem gotinhas de água do lado de fora do copo. Essas gotas surgem porque",o:["o refrigerante atravessa os poros do vidro.","o vapor de água do ar se condensa ao encostar no copo frio.","o gelo derrete dentro do copo e escorre.","o vidro produz água quando esfria.","o gás do refrigerante vira água ao sair do copo."],c:1,e:"Condensação: vapor do ambiente esfria em contato com o copo e vira líquido."},
{a:"CN",t:"capim → gafanhoto → sapo → cobra → gavião",f:"Cadeia alimentar.",q:"Nessa cadeia alimentar, o sapo ocupa a posição de",o:["produtor.","consumidor primário.","consumidor secundário.","consumidor terciário.","decompositor."],c:2,e:"Capim = produtor; gafanhoto = 1º consumidor; sapo = 2º."},
{a:"CN",q:"A dengue é transmitida pela picada do mosquito Aedes aegypti. Uma das medidas mais eficazes para prevenir a doença é",o:["tomar antibióticos quando houver casos no bairro.","evitar contato com pessoas doentes.","ferver a água antes de beber.","lavar bem frutas e verduras.","eliminar recipientes que acumulem água parada."],c:4,e:"O mosquito se reproduz em água parada; sem criadouro, sem mosquito."},
{a:"CN",q:"Entre as fontes de energia abaixo, a única considerada renovável é",o:["o carvão mineral.","o petróleo.","o gás natural.","a energia eólica.","o óleo diesel."],c:3,e:"Vento não se esgota; as demais são combustíveis fósseis."},
{a:"CN",q:"Um ônibus saiu da rodoviária às 7h e chegou ao destino às 10h, percorrendo 180 km. Sua velocidade média foi de",o:["30 km/h.","45 km/h.","60 km/h.","90 km/h.","540 km/h."],c:2,e:"180 km ÷ 3 h = 60 km/h."},
{a:"CN",q:"No sangue, as células responsáveis pelo transporte de oxigênio dos pulmões para o restante do corpo são",o:["as hemácias.","os leucócitos.","as plaquetas.","os neurônios.","os anticorpos."],c:0,e:"Hemácias (glóbulos vermelhos) têm hemoglobina, que leva o oxigênio."},
{a:"CN",q:"Ao misturar água e óleo de cozinha em um recipiente, formam-se duas camadas. Para separar esses líquidos, o método mais adequado é a",o:["filtração.","decantação (com funil de separação).","destilação simples.","peneiração.","evaporação."],c:1,e:"Líquidos que não se misturam e têm densidades diferentes: decantação."},
{a:"CN",q:"Vacinas e soros são usados na área da saúde. A diferença entre eles é que",o:["ambos têm a mesma função e podem ser trocados.","o soro previne doenças e a vacina só trata.","a vacina já contém anticorpos prontos.","o soro faz o corpo produzir memória para sempre.","a vacina estimula o corpo a produzir defesas, enquanto o soro já traz anticorpos prontos."],c:4,e:"Vacina = prevenção (memória imunológica); soro = tratamento imediato."},
{a:"HIS",t:"Em 13 de maio de 1888 foi assinada a Lei Áurea, que extinguiu a escravidão no Brasil. A lei, porém, não veio acompanhada de medidas como acesso à terra, à educação ou ao trabalho remunerado para os libertos.",q:"Uma consequência dessa forma de abolição foi",o:["a imediata igualdade social entre negros e brancos.","a distribuição de terras para todos os ex-escravizados.","o fim da monarquia no mesmo dia da assinatura da lei.","a marginalização de grande parte da população liberta, com efeitos que chegam aos dias de hoje.","a volta dos libertos para a África com apoio do governo."],c:3,e:"Sem políticas de integração, a população liberta ficou excluída; desigualdade persistente."},
{a:"HIS",q:"A Constituição de 1988, chamada de “Constituição Cidadã”, é considerada um marco porque",o:["instituiu a monarquia parlamentarista no Brasil.","marcou a redemocratização após o período da ditadura militar, garantindo direitos sociais e o voto direto.","proibiu o voto das mulheres.","foi escrita por D. Pedro II.","criou o regime militar no país."],c:1,e:"Promulgada após a ditadura (1964–1985), ampliou direitos e liberdades."},
{a:"HIS",q:"A Revolução Industrial, iniciada na Inglaterra no século XVIII, teve como uma de suas características",o:["o fim do trabalho assalariado.","o retorno à produção artesanal.","a diminuição da população das cidades.","a proibição das máquinas nas fábricas.","o uso da máquina a vapor e o trabalho em fábricas, com jornadas longas e baixos salários."],c:4,e:"Máquina a vapor, fábricas, crescimento urbano e exploração do operário."},
{a:"HIS",q:"Em 1943, durante o governo de Getúlio Vargas, foi criado um conjunto de leis que reuniu direitos como carteira de trabalho, férias e jornada regulamentada. Esse conjunto ficou conhecido como",o:["CLT – Consolidação das Leis do Trabalho.","Código de Defesa do Consumidor.","Estatuto da Criança e do Adolescente.","Lei Áurea.","Constituição de 1988."],c:0,e:"A CLT é de 1943, Era Vargas."},
{a:"HIS",q:"As Grandes Navegações dos séculos XV e XVI, lideradas por Portugal e Espanha, tinham como principal objetivo",o:["levar os europeus para morar na Ásia.","combater a pirataria no Oceano Pacífico.","encontrar novas rotas comerciais, especialmente para obter especiarias do Oriente.","fugir de uma guerra mundial na Europa.","estudar animais marinhos."],c:2,e:"Busca de rotas para as especiarias e riquezas, contornando o Mediterrâneo."},
{a:"HIS",q:"A Independência do Brasil, em 1822, teve como característica",o:["a criação imediata de uma república.","a manutenção da monarquia, com D. Pedro I como imperador, e da escravidão.","o fim da escravidão no país.","a participação decisiva de exércitos dos Estados Unidos.","a divisão do território em vários países."],c:1,e:"O Brasil virou Império com D. Pedro I e a escravidão continuou até 1888."},
{a:"GEO",q:"Uma pessoa está parada de frente para o local onde o Sol nasce. À sua direita estará o ponto cardeal",o:["norte.","sul.","oeste.","leste.","nordeste."],c:1,e:"De frente para o leste: esquerda = norte, direita = sul, costas = oeste."},
{a:"GEO",q:"Entre as décadas de 1950 e 1980, milhões de brasileiros deixaram o campo em direção às cidades em busca de trabalho. Esse movimento é chamado de",o:["êxodo rural.","transumância.","migração pendular.","imigração.","nomadismo."],c:0,e:"Êxodo rural = saída em massa do campo para a cidade."},
{a:"GEO",q:"O bioma brasileiro que se estendia por grande parte do litoral e que hoje é o mais devastado, restando pequena parte da área original, é",o:["a Amazônia.","o Cerrado.","a Caatinga.","a Mata Atlântica.","o Pampa."],c:3,e:"A ocupação do litoral desde 1500 destruiu a maior parte da Mata Atlântica."},
{a:"GEO",q:"Um jogo de futebol começa às 10h em Brasília. Considerando que Londres está 3 horas à frente de Brasília, nesse momento serão, em Londres,",o:["7h.","10h.","12h.","13h.","16h."],c:3,e:"Londres fica a leste: soma 3 h. 10h + 3h = 13h."},
{a:"GEO",q:"Em grandes cidades, a temperatura costuma ser mais alta no centro do que nos bairros afastados e arborizados. Esse fenômeno, chamado ilha de calor, é causado principalmente",o:["pela proximidade com o mar.","pelo excesso de chuvas no verão.","pelo asfalto, concreto, poluição e pouca vegetação nas áreas centrais.","pela altitude elevada das cidades.","pela presença de rios urbanos."],c:2,e:"Superfícies que absorvem calor + pouca área verde."},
{a:"GEO",q:"A chuva ácida pode danificar plantações, monumentos e prejudicar rios. Sua principal causa é",o:["o desmatamento da Amazônia.","o uso excessivo de água na agricultura.","o derretimento das geleiras.","o lixo jogado nas ruas.","a liberação de gases poluentes pela queima de combustíveis fósseis em indústrias e veículos."],c:4,e:"Óxidos de enxofre e nitrogênio reagem com a água da atmosfera."},
{a:"CID",q:"Uma pessoa comprou uma geladeira que apresentou defeito. De acordo com o Código de Defesa do Consumidor, o prazo para reclamar de defeito aparente em produto durável é de",o:["7 dias.","15 dias.","90 dias.","1 ano.","5 anos."],c:2,e:"Art. 26 do CDC: 30 dias para não duráveis, 90 dias para duráveis."},
{a:"CID",t:"Cores da coleta seletiva\nAzul: papel\nVermelho: plástico\nVerde: vidro\nAmarelo: metal",q:"Uma garrafa PET de refrigerante, já vazia e limpa, deve ser colocada no coletor de cor",o:["azul.","vermelha.","verde.","amarela.","marrom."],c:1,e:"PET é plástico: vermelho."},
{a:"CID",q:"A Lei nº 11.340/2006, conhecida como Lei Maria da Penha, tem como objetivo",o:["regulamentar o trabalho doméstico.","garantir vagas para mulheres em universidades.","definir regras para a aposentadoria.","proteger crianças em situação de trabalho infantil.","criar mecanismos para coibir a violência doméstica e familiar contra a mulher."],c:4,e:"É a lei de proteção à mulher contra violência doméstica e familiar."},
{a:"CID",t:"INFORMAÇÃO NUTRICIONAL\nPorção de 30 g (6 biscoitos)\nAçúcares: 6 g",f:"Rótulo de um pacote de biscoito de 150 g.",q:"Se uma pessoa comer o pacote inteiro, ela vai ingerir, de açúcar,",o:["6 g.","12 g.","18 g.","30 g.","150 g."],c:3,e:"150 g = 5 porções de 30 g; 5 × 6 g = 30 g."},
{a:"CID",q:"Pilhas, baterias de celular e aparelhos eletrônicos velhos não devem ser jogados no lixo comum porque",o:["contêm metais pesados que contaminam o solo e a água, devendo ir para pontos de coleta específicos.","ocupam muito espaço nos caminhões de lixo.","podem ser vendidos por um preço alto.","são feitos apenas de papel reciclável.","atraem insetos transmissores de doenças."],c:0,e:"Mercúrio, chumbo e cádmio contaminam o ambiente; há pontos de coleta próprios."},
{a:"LP",t:T_FEIRA,f:"Texto escrito para este simulado.",q:"Na fala de Seu Antônio, “o conselho, hoje, está em promoção: de graça”, o feirante",o:["anuncia que passou a cobrar pelos conselhos que dá.","reclama do freguês, que nunca paga pelo que leva.","responde com bom humor, tratando o conselho como se fosse mercadoria da barraca.","anuncia um desconto em todas as frutas.","recusa-se a atender o freguês."],c:2,e:"O freguês brinca ao pedir “um conselho” junto com as bananas, e Seu Antônio entra na brincadeira: o conselho vira “produto” em promoção, e de graça."},
{a:"LP",t:T_FEIRA,q:"O trecho “já sabe de cor o que ele vai pedir” mostra que",o:["Seu Antônio decorou os preços de todas as frutas.","o feirante e o freguês já se conhecem e têm o hábito de se encontrar.","o freguês não sabe o que quer comprar.","Seu Antônio tem dificuldade para ler os pedidos.","o freguês chega sempre atrasado."],c:1,e:"“De cor” = de memória. Ele sabe o pedido porque o freguês é antigo, de casa."},
{a:"LP",t:T_BIBLIO,f:"Aviso criado para este simulado.",q:"De acordo com o aviso, durante a reforma, o aluno que precisar devolver um livro deve",o:["esperar a biblioteca reabrir.","deixá-lo na portaria a qualquer hora.","levá-lo à secretaria da escola, de segunda a sexta, das 9h às 11h.","enviá-lo pelo correio.","entregá-lo ao bibliotecário em casa."],c:2,e:"A informação está explícita no segundo período do aviso."},
{a:"LP",t:T_BIBLIO,q:"A frase final do aviso, “Contamos com a colaboração de todos”, tem a função de",o:["narrar um acontecimento passado.","fazer um pedido de forma educada, buscando a cooperação dos leitores.","criticar quem devolve livros fora do prazo.","dar uma ordem sem possibilidade de recusa.","fazer propaganda da escola."],c:1,e:"É uma fórmula de cortesia usada em avisos para pedir a cooperação do público."},
{a:"LP",t:T_CICLO,f:"Notícia criada para este simulado.",q:"Pelo conteúdo da notícia, a nova ciclovia",o:["liga o terminal de ônibus ao parque da cidade.","tem 80 km de extensão.","foi construída em dois meses.","custou R$ 400 mil.","atende somente ciclistas profissionais."],c:0,e:"O texto diz que a ciclovia “liga o terminal de ônibus ao parque da cidade”."},
{a:"LP",t:T_CICLO,q:"Assinale a frase que expressa uma opinião, e não um fato.",o:["A ciclovia tem 8 km de extensão.","A obra levou seis meses para ser concluída.","A obra custou R$ 2 milhões.","Cerca de 400 ciclistas usam a ciclovia por dia, segundo a prefeitura.","A ciclovia é a obra mais bonita que a prefeitura já fez."],c:4,e:"“Mais bonita” depende do ponto de vista de quem fala. As demais informações podem ser conferidas com dados."},
{a:"LP",t:T_CELULAR,f:"Texto de opinião criado para este simulado.",q:"A ideia central defendida pelo autor do texto é que",o:["o celular deve ser proibido em todas as escolas.","o celular é benéfico em qualquer situação.","os professores não entendem de tecnologia.","o que decide se o celular ajuda ou atrapalha é o modo como ele é usado.","as pesquisas na internet são menos confiáveis que o dicionário."],c:3,e:"A tese aparece na conclusão: “o problema não está no celular, e sim na maneira como ele é usado”."},
{a:"LP",t:T_CELULAR,q:"No trecho “ele se transforma em um aliado do aprendizado”, a palavra “aliado” indica algo que",o:["atrapalha os estudos.","favorece e ajuda no aprendizado.","substitui o professor.","é indiferente à aula.","só funciona fora da escola."],c:1,e:"Aliado = parceiro, quem ajuda. É um sentido figurado aplicado ao celular."},
{a:"LP",t:T_ENQUETE,f:"Dados criados para este simulado.",q:"Com base na enquete, é correto afirmar que",o:["mais da metade dos alunos vai de ônibus.","a maioria dos alunos vai a pé.","o número de alunos que vai de bicicleta é igual ao dos que vão de carro.","os alunos que vão a pé são o dobro dos que vão de ônibus.","quase metade dos alunos vai de ônibus."],c:4,e:"90 de 200 alunos = 45%: quase metade, mas não mais da metade."},
{a:"LP",t:T_CHUVA,f:"Poema escrito para este simulado.",q:"No verso “Cada gota é um relógio”, o eu lírico sugere que a chuva",o:["está atrasada.","faz a hora passar devagar, tornando a espera mais longa.","atrapalha o funcionamento dos relógios.","chegou em um horário previsto.","é muito forte."],c:1,e:"Metáfora: as gotas “contam o tempo”, e o tempo “não quer passar”, o que passa a sensação de lentidão."},
{a:"LP",q:"Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.",o:["Fazem anos que não nos vemos.","Houveram várias queixas sobre o barulho.","Choveram elogios ao professor no fim do ano.","Precisam-se de pedreiros.","Existe muitos livros na estante."],c:2,e:"“Elogios” é o sujeito de “choveram” (plural). Nas demais: “faz anos”, “houve queixas”, “precisa-se de” e “existem livros”."},
{a:"LP",q:"Assinale a frase em que a concordância nominal está correta.",o:["Seguem anexo as fotos da obra.","Elas mesmo prepararam o jantar.","Ela estava meia cansada.","É proibido a entrada de menores.","Seguem anexas as fotos da obra."],c:4,e:"“Anexas” concorda com “fotos”. As demais deveriam ser: “elas mesmas”, “meio cansada” e “é proibida a entrada”."},
{a:"LP",q:"Assinale a alternativa em que todas as palavras estão grafadas corretamente.",o:["excessão, privilégio, obsessão","exceção, previlégio, obsessão","exceção, privilégio, obseção","exceção, privilégio, obsessão","excessão, previlégio, obseção"],c:3,e:"Exceção (com ç), privilégio (com i) e obsessão (com ss)."},
{a:"LP",q:"Assinale a frase em que a vírgula está empregada corretamente.",o:["O gato, subiu no telhado.","Comprei, pão leite e queijo.","Maria, venha até aqui agora.","Os alunos, estudaram bastante.","Não sei, se ele virá hoje."],c:2,e:"A vírgula isola o vocativo (“Maria”). Não se separa o sujeito do verbo nem o verbo do complemento."},
{a:"LP",q:"Em “Entreguei-lhe o relatório ontem”, o pronome “lhe” exerce a função de",o:["sujeito.","adjunto adverbial.","complemento indireto (a ele ou a ela).","predicativo do sujeito.","vocativo."],c:2,e:"Entrega-se algo a alguém: “lhe” equivale a “a ele/a ela” e é complemento indireto."},
{a:"LP",q:"Em “Se eu tivesse mais tempo, viajaria com mais frequência.”, o verbo “viajaria” está no",o:["presente do indicativo.","pretérito perfeito do indicativo.","futuro do presente do indicativo.","imperativo afirmativo.","futuro do pretérito do indicativo."],c:4,e:"A terminação -ria indica uma possibilidade que depende de uma condição: futuro do pretérito."},
{a:"LP",q:"Na frase “O prefeito foi enfático ao negar o aumento do imposto”, a palavra “enfático” pode ser substituída, sem prejuízo de sentido, por",o:["hesitante.","irônico.","categórico.","vago.","indiferente."],c:2,e:"Enfático = que fala com ênfase e firmeza; categórico."},
{a:"LP",q:"A palavra que tem sentido oposto ao de “escassez” é",o:["falta.","abundância.","pobreza.","avareza.","demora."],c:1,e:"Escassez é a pouca quantidade de algo; o antônimo é abundância (fartura)."},
{a:"LP",q:"No período “O time jogou bem, mas perdeu a partida.”, a conjunção “mas” estabelece uma relação de",o:["adição.","explicação.","oposição.","conclusão.","tempo."],c:2,e:"“Mas” liga ideias contrárias: jogou bem × perdeu."},
{a:"LP",t:T_RECEITA,f:"Trecho de receita criado para este simulado.",q:"O texto é predominantemente injuntivo (instrucional) porque",o:["conta uma história com personagens.","descreve as características de um objeto.","defende um ponto de vista.","orienta o leitor sobre o que fazer, passo a passo.","expressa sentimentos do autor."],c:3,e:"Verbos no imperativo e sequência de ações indicam um texto de instrução."},
{a:"LP",q:"Em “Meu pai é um leão quando alguém mexe com a família”, ocorre",o:["antítese, pois une ideias opostas.","eufemismo, pois suaviza uma ideia ruim.","metáfora, pois aproxima o pai do leão por semelhança, sem usar “como”.","onomatopeia, pois imita um som.","pleonasmo, pois repete a mesma ideia."],c:2,e:"Metáfora: comparação implícita, que associa o pai à coragem e à ferocidade do leão."},
{a:"LP",q:"Durante uma tempestade, alguém olha pela janela e diz: “Que dia lindo para um passeio!”. Nessa frase, o falante usa",o:["comparação, aproximando o dia de um passeio.","onomatopeia, imitando o som da chuva.","ironia, dizendo o contrário do que pensa.","gíria, por ser uma fala informal.","hipérbole, por exagerar na beleza do dia."],c:2,e:"Ironia: afirma o oposto do que realmente pensa, com intenção crítica ou bem-humorada."},
{a:"LP",q:"“Mexerica”, “bergamota” e “tangerina” são nomes de uma mesma fruta usados em regiões diferentes do Brasil. Esse fato exemplifica",o:["um erro de português.","o uso de gírias de um grupo jovem.","uma variação regional da língua.","uma linguagem técnica de uma profissão.","uma variação provocada apenas pela idade do falante."],c:2,e:"Variação regional (ou geográfica): uma mesma coisa recebe nomes diferentes conforme a região."},
{a:"LP",q:"Assinale a frase em que o verbo está corretamente flexionado.",o:["Se você ver o resultado, me ligue.","Quando eles verem a prova, vão se assustar.","Se eu ver você na rua, aviso.","Quando você vir a nota, vai gostar.","Se nós verem a nota, ficaremos felizes."],c:3,e:"O futuro do subjuntivo de “ver” é “vir” (se eu vir, quando você vir, se eles virem)."},
{a:"LP",q:"Assinale a alternativa que completa corretamente a frase: “Ele acordou de ____ humor porque dormiu ____.”",o:["mal – mau.","mau – mal.","mau – mau.","mal – mal.","mau – bem."],c:1,e:"“Mau” (adjetivo, oposto de “bom”) acompanha “humor”; “mal” (advérbio, oposto de “bem”) modifica “dormiu”."},
{a:"LP",q:"Assinale a alternativa que completa corretamente a frase: “____ você faltou à reunião de ontem?”",o:["Porque","Por quê","Porquê","Por que","Pôr que"],c:3,e:"No início da pergunta usa-se “por que” (separado e sem acento). “Por quê” só aparece no final da frase."},
{a:"LP",q:"Assinale a alternativa que preenche corretamente as lacunas: “Faz muito tempo, ____ dois anos, que não nos vemos. O encontro será daqui ____ dois dias.”",o:["há – a","a – há","há – há","a – a","à – há"],c:0,e:"“Há” indica tempo já passado; “a” indica tempo futuro (“daqui a dois dias”)."},
{a:"LP",q:"De acordo com as regras atuais de acentuação, a palavra acentuada corretamente é",o:["idéia.","jibóia.","feiúra.","bóia.","herói."],c:4,e:"Com o Acordo Ortográfico, “ideia”, “jiboia”, “feiura” e “boia” perderam o acento. “Herói” continua acentuada (oxítona terminada em -ói)."},
{a:"LP",q:"Assinale a alternativa que transforma “A equipe construiu a ponte” para a voz passiva.",o:["A ponte construiu a equipe.","A ponte foi construída pela equipe.","A equipe foi construída pela ponte.","A equipe vai construir a ponte.","A ponte construiu-se a equipe."],c:1,e:"Na voz passiva, o objeto vira sujeito (“a ponte”) e o agente aparece com “por”: “foi construída pela equipe”."},
{a:"LP",q:"Em “Choveu muito ontem”, a oração apresenta",o:["sujeito simples.","sujeito composto.","sujeito oculto.","sujeito indeterminado.","sujeito inexistente (oração sem sujeito)."],c:4,e:"Verbos que indicam fenômenos da natureza (chover, nevar) não têm sujeito."},
{a:"MAT",q:"Uma camiseta custava R$ 80,00 e entrou em promoção com 25% de desconto. O preço promocional é",o:["R$ 55,00.","R$ 60,00.","R$ 65,00.","R$ 20,00.","R$ 75,00."],c:1,e:"25% de 80 = 20; 80 − 20 = 60."},
{a:"MAT",q:"Em uma sala há 40 alunos, dos quais 60% são meninas. O número de meninos é",o:["12.","16.","20.","24.","28."],c:1,e:"Meninos = 40% de 40 = 16."},
{a:"MAT",q:"Uma receita usa 3 xícaras de farinha para fazer 12 pães. Para fazer 40 pães, serão necessárias",o:["8 xícaras.","9 xícaras.","10 xícaras.","12 xícaras.","13 xícaras."],c:2,e:"3 ÷ 12 = 0,25 xícara por pão; 0,25 × 40 = 10 xícaras."},
{a:"MAT",q:"Um carro percorre 12 km com 1 litro de gasolina. Para percorrer 150 km, ele gastará",o:["10 litros.","12 litros.","12,5 litros.","13,5 litros.","15 litros."],c:2,e:"150 ÷ 12 = 12,5 litros."},
{a:"MAT",q:"Um terreno retangular tem 20 m de comprimento e 15 m de largura. Para cercá-lo com 3 voltas de arame, serão necessários",o:["105 m de arame.","140 m de arame.","210 m de arame.","300 m de arame.","900 m de arame."],c:2,e:"Perímetro = 2 × (20 + 15) = 70 m; 3 voltas = 210 m."},
{a:"MAT",q:"Um triângulo retângulo tem catetos de 6 cm e 8 cm. A hipotenusa mede",o:["9 cm.","10 cm.","12 cm.","14 cm.","100 cm."],c:1,e:"Pitágoras: 6² + 8² = 36 + 64 = 100; √100 = 10."},
{a:"MAT",q:"Considerando π = 3, a área de um círculo de raio 5 cm é de",o:["15 cm².","30 cm².","75 cm².","150 cm².","225 cm²."],c:2,e:"A = π × r² = 3 × 25 = 75 cm²."},
{a:"MAT",q:"O valor de x na equação 3x − 7 = 11 é",o:["4.","5.","6.","7.","18."],c:2,e:"3x = 18, logo x = 6."},
{a:"MAT",q:"A soma de dois números consecutivos é 85. O maior deles é",o:["41.","42.","43.","44.","45."],c:2,e:"x + (x + 1) = 85 → x = 42; o maior é 43."},
{a:"MAT",q:"Em uma lanchonete, 2 sanduíches e 3 sucos custam R$ 36,00. Sabendo que cada suco custa R$ 4,00, o preço de um sanduíche é",o:["R$ 8,00.","R$ 10,00.","R$ 12,00.","R$ 14,00.","R$ 24,00."],c:2,e:"3 sucos = R$ 12,00; sobram R$ 24,00 para 2 sanduíches, ou seja, R$ 12,00 cada."},
{a:"MAT",q:"Ao lançar um dado comum de seis faces, a probabilidade de sair um número maior que 4 é",o:["1/6.","1/3.","1/2.","2/3.","5/6."],c:1,e:"Casos favoráveis: 5 e 6 (2 casos) em 6 possíveis: 2/6 = 1/3."},
{a:"MAT",q:"A média das notas de um aluno em cinco provas foi 8. As notas das quatro primeiras foram 6, 8, 7 e 9. A nota da quinta prova foi",o:["6.","7.","8.","9.","10."],c:4,e:"Soma total = 5 × 8 = 40; as quatro primeiras somam 30; a quinta foi 10."},
{a:"MAT",q:"O consumo de energia de uma casa, em kWh, em cinco meses foi: 120, 150, 130, 180 e 140. A mediana desses valores é",o:["130.","140.","144.","150.","180."],c:1,e:"Em ordem crescente: 120, 130, 140, 150, 180. O valor central é 140. (A média seria 144.)"},
{a:"MAT",t:T_PADARIA,f:"Dados criados para este simulado.",q:"Do total de pães vendidos de segunda a sexta, a quarta-feira representa",o:["15%.","20%.","25%.","30%.","50%."],c:2,e:"Total = 1.000 pães; quarta = 250; 250 ÷ 1.000 = 25%."},
{a:"MAT",q:"Em uma planta, 1 cm representa 2 m. Uma sala com 6 m de comprimento será desenhada com",o:["1 cm.","2 cm.","3 cm.","6 cm.","12 cm."],c:2,e:"6 m ÷ 2 m por cm = 3 cm."},
{a:"MAT",q:"Um cubo tem aresta de 3 dm. Sabendo que 1 dm³ equivale a 1 litro, sua capacidade é de",o:["9 litros.","18 litros.","27 litros.","81 litros.","270 litros."],c:2,e:"Volume = 3 × 3 × 3 = 27 dm³ = 27 litros."},
{a:"MAT",q:"Uma garrafa tem 1,5 litro de suco. Quantos copos de 250 mL podem ser servidos com todo o conteúdo?",o:["4.","5.","6.","7.","8."],c:2,e:"1,5 L = 1.500 mL; 1.500 ÷ 250 = 6 copos."},
{a:"MAT",q:"Uma viagem de 270 km foi feita a uma velocidade média de 90 km/h. O tempo gasto foi de",o:["2 horas.","2 h 30 min.","3 horas.","3 h 30 min.","4 horas."],c:2,e:"Tempo = distância ÷ velocidade = 270 ÷ 90 = 3 horas."},
{a:"MAT",q:"Um produto de R$ 200,00 teve um aumento de 10% e, depois, um desconto de 10% sobre o novo preço. O preço final é",o:["R$ 180,00.","R$ 190,00.","R$ 198,00.","R$ 200,00.","R$ 220,00."],c:2,e:"200 × 1,10 = 220; 220 × 0,90 = 198. Aumento e desconto de mesma porcentagem não se anulam."},
{a:"MAT",q:"O valor da expressão 2³ + 3² − 4 é",o:["9.","11.","13.","15.","17."],c:2,e:"2³ = 8 e 3² = 9: 8 + 9 − 4 = 13."},
{a:"MAT",q:"Duas linhas de ônibus saem do terminal juntas às 6h. Uma sai a cada 12 minutos e a outra a cada 18 minutos. Elas voltarão a sair juntas às",o:["6h24.","6h30.","6h36.","6h48.","7h12."],c:2,e:"MMC(12, 18) = 36 minutos; 6h + 36 min = 6h36."},
{a:"MAT",q:"Uma professora quer dividir 24 lápis e 36 canetas em kits iguais, sem sobras, formando o maior número possível de kits. Serão formados",o:["6 kits.","8 kits.","12 kits.","24 kits.","36 kits."],c:2,e:"MDC(24, 36) = 12 kits, cada um com 2 lápis e 3 canetas."},
{a:"MAT",q:"Em um triângulo, dois ângulos internos medem 50° e 60°. O terceiro ângulo mede",o:["60°.","70°.","80°.","90°.","110°."],c:1,e:"A soma dos ângulos internos é 180°: 180 − 50 − 60 = 70°."},
{a:"MAT",q:"Maria gastou 1/3 do salário no aluguel e 1/4 na alimentação. A fração do salário que sobrou é",o:["1/12.","5/12.","7/12.","1/2.","2/7."],c:1,e:"1/3 + 1/4 = 4/12 + 3/12 = 7/12 gastos; sobram 5/12."},
{a:"MAT",q:"Um estacionamento cobra R$ 6,00 pela primeira hora e R$ 4,00 por hora adicional. Um carro ficou 5 horas. O valor pago foi",o:["R$ 20,00.","R$ 22,00.","R$ 24,00.","R$ 26,00.","R$ 30,00."],c:1,e:"6 + 4 × 4 = 6 + 16 = R$ 22,00."},
{a:"MAT",t:T_PLANOS,f:"Planos criados para este simulado.",q:"Com quantos minutos de ligação por mês os dois planos custam exatamente o mesmo valor?",o:["30 minutos.","45 minutos.","60 minutos.","100 minutos.","160 minutos."],c:2,e:"50 + 0,50 × m = 80 → 0,50 × m = 30 → m = 60 minutos."},
{a:"MAT",q:"O resultado da expressão (−3) × (−4) + (−5) é",o:["−17.","−7.","7.","17.","−12."],c:2,e:"(−3) × (−4) = +12; 12 + (−5) = 7."},
{a:"MAT",q:"Um quadrado tem área de 81 cm². Seu perímetro é",o:["9 cm.","18 cm.","27 cm.","36 cm.","81 cm."],c:3,e:"Lado = √81 = 9 cm; perímetro = 4 × 9 = 36 cm."},
{a:"MAT",q:"Após um desconto de 20%, uma bicicleta passou a custar R$ 640,00. O preço original era",o:["R$ 512,00.","R$ 700,00.","R$ 768,00.","R$ 800,00.","R$ 840,00."],c:3,e:"R$ 640,00 correspondem a 80% do preço original: 640 ÷ 0,8 = 800."},
{a:"MAT",q:"Uma pessoa recebe R$ 3.000,00 por mês. Ela gasta 40% com moradia, 25% com alimentação e 15% com transporte. O valor que sobra é",o:["R$ 400,00.","R$ 600,00.","R$ 800,00.","R$ 900,00.","R$ 1.200,00."],c:1,e:"40% + 25% + 15% = 80%; sobram 20% de 3.000 = R$ 600,00."},
{a:"CN",q:"A fotossíntese é o processo pelo qual as plantas produzem o próprio alimento. Os principais ingredientes usados nesse processo são",o:["oxigênio e glicose.","gás carbônico, água e luz solar.","apenas nitrogênio e sais minerais.","glicose e luz solar.","água e oxigênio."],c:1,e:"Gás carbônico + água + luz → glicose + oxigênio."},
{a:"CN",q:"As estações do ano ocorrem principalmente porque",o:["a Terra se afasta e se aproxima do Sol ao longo do ano.","o eixo de rotação da Terra é inclinado em relação ao plano de sua órbita.","a Lua bloqueia parte da luz do Sol.","o Sol muda de tamanho durante o ano.","a Terra gira mais rápido no verão."],c:1,e:"A inclinação do eixo faz cada hemisfério receber luz solar de modo diferente ao longo do ano."},
{a:"CN",q:"As fases da Lua são consequência",o:["da sombra da Terra projetada sobre a Lua todos os meses.","da mudança do tamanho da Lua.","da posição da Lua em relação à Terra e ao Sol, que muda a parte iluminada que vemos daqui.","do movimento de rotação da Terra.","das nuvens que cobrem a Lua."],c:2,e:"A Lua sempre tem metade iluminada pelo Sol; o que muda é quanto dessa metade enxergamos da Terra."},
{a:"CN",q:"Um circuito elétrico simples é formado por uma pilha, fios e uma lâmpada. Para a lâmpada acender, é necessário que",o:["o circuito esteja aberto, interrompido em algum ponto.","o circuito esteja fechado, formando um caminho contínuo para a corrente.","a lâmpada fique longe da pilha.","a pilha esteja sem polo positivo.","os fios sejam feitos de plástico."],c:1,e:"A corrente só circula se houver um caminho contínuo (circuito fechado) feito de material condutor."},
{a:"CN",q:"Na tabela periódica, os elementos químicos estão organizados em ordem crescente de",o:["número de nêutrons.","número atômico (quantidade de prótons).","ano de descoberta.","densidade.","ponto de fusão."],c:1,e:"O número atômico é a quantidade de prótons no núcleo e define o elemento."},
{a:"CN",q:"Entre os materiais cobre, borracha, alumínio e madeira, os dois que são bons condutores de eletricidade são",o:["borracha e madeira.","cobre e borracha.","alumínio e madeira.","cobre e alumínio.","madeira e cobre."],c:3,e:"Metais, como cobre e alumínio, conduzem bem a eletricidade; borracha e madeira são isolantes."},
{a:"CN",q:"A água do mar, que contém sal dissolvido, é classificada como",o:["substância simples.","substância composta pura.","mistura homogênea.","mistura heterogênea.","elemento químico."],c:2,e:"O sal dissolvido forma uma única fase com a água: mistura homogênea (solução)."},
{a:"CN",q:"Uma das principais causas do aumento do gás carbônico na atmosfera, que agrava o efeito estufa, é",o:["a fotossíntese das florestas.","a queima de combustíveis fósseis e as queimadas.","o uso de energia solar.","a reciclagem de papel.","o plantio de árvores."],c:1,e:"Queimar combustíveis e florestas libera CO₂ que estava armazenado."},
{a:"CN",q:"Entre os fenômenos abaixo, o que representa uma reação química é",o:["derreter um cubo de gelo.","quebrar um copo de vidro.","a formação de ferrugem em um prego.","dissolver açúcar na água.","evaporar a água de uma poça."],c:2,e:"Na ferrugem o ferro reage com o oxigênio e a umidade e forma outro material. Nos demais casos a substância continua a mesma."},
{a:"CN",q:"No sistema digestório, a maior parte da absorção dos nutrientes dos alimentos ocorre no",o:["estômago.","esôfago.","intestino delgado.","intestino grosso.","fígado."],c:2,e:"O intestino delgado tem vilosidades que aumentam a área de absorção. O intestino grosso absorve principalmente água."},
{a:"CN",q:"Na inspiração, o músculo que se contrai e desce, aumentando o volume da caixa torácica, é o",o:["coração.","diafragma.","bíceps.","estômago.","esôfago."],c:1,e:"A contração do diafragma aumenta o espaço dos pulmões e o ar entra."},
{a:"CN",q:"Os genes, que carregam as informações hereditárias, são segmentos de",o:["proteínas do sangue.","DNA, localizado nos cromossomos.","gordura das células.","açúcares da membrana.","sais minerais."],c:1,e:"Genes são trechos de DNA, organizados nos cromossomos."},
{a:"CN",q:"O pelo branco do urso-polar o ajuda a se camuflar na neve. Segundo a seleção natural, isso ocorre porque",o:["cada urso muda de cor conforme a necessidade.","os ursos de pelagem clara tinham mais chance de sobreviver e deixar descendentes.","o frio faz o pelo ficar branco em todos os ursos.","os ursos escolhem a cor do próprio pelo.","a neve pinta o pelo dos ursos."],c:1,e:"Características vantajosas no ambiente se tornam mais comuns ao longo das gerações."},
{a:"CN",q:"Em uma lagoa, o esgoto lançado provoca a multiplicação excessiva de algas, o que reduz o oxigênio da água e pode matar peixes. Esse fenômeno é chamado de",o:["eutrofização.","fotossíntese.","chuva ácida.","inversão térmica.","erosão."],c:0,e:"O excesso de nutrientes provoca a proliferação de algas; sua decomposição consome o oxigênio."},
{a:"CN",q:"A vacinação em massa protege também quem não pode ser vacinado, porque",o:["a vacina é transmitida pelo ar.","diminui a circulação do agente causador, dificultando a transmissão da doença.","elimina a necessidade de higiene.","torna todos os doentes imunes.","faz os vírus desaparecerem do planeta."],c:1,e:"Com mais pessoas protegidas, o agente infeccioso encontra menos hospedeiros para se espalhar."},
{a:"CN",q:"Um aparelho de 2.000 W fica ligado por 3 horas. A energia consumida é de",o:["2 kWh.","3 kWh.","5 kWh.","6 kWh.","6.000 kWh."],c:3,e:"2.000 W = 2 kW; 2 kW × 3 h = 6 kWh."},
{a:"CN",q:"Em um dia frio, a maçaneta metálica parece mais fria que a porta de madeira, embora as duas estejam na mesma temperatura. Isso acontece porque",o:["o metal tem temperatura menor que a madeira.","o metal conduz calor melhor e retira o calor da mão mais rapidamente.","a madeira produz calor.","a porta é mais grossa que a maçaneta.","o metal está sempre úmido."],c:1,e:"O metal é bom condutor térmico, por isso “rouba” calor da mão com mais rapidez."},
{a:"CN",q:"Em uma tempestade, vemos o relâmpago antes de ouvir o trovão porque",o:["a luz se propaga muito mais rápido que o som.","o som se propaga mais rápido que a luz.","o trovão só acontece depois que a chuva começa.","o relâmpago e o trovão ocorrem em horas diferentes.","o ouvido humano demora a funcionar."],c:0,e:"A luz viaja a cerca de 300 000 km/s; o som, a cerca de 340 m/s."},
{a:"CN",q:"Na estação de tratamento da água, a etapa em que se usa cloro para eliminar microrganismos é a",o:["floculação.","decantação.","filtração.","desinfecção.","captação."],c:3,e:"A desinfecção, geralmente com cloro, elimina bactérias e vírus que sobraram."},
{a:"CN",q:"A compostagem transforma restos de alimentos em adubo. Esse processo é realizado principalmente por",o:["metais.","decompositores, como fungos e bactérias.","plantas verdes.","animais herbívoros.","minerais."],c:1,e:"Fungos e bactérias decompõem a matéria orgânica e devolvem nutrientes ao solo."},
{a:"CN",q:"A camada de ozônio, na atmosfera, é importante porque",o:["produz as chuvas.","retém parte da radiação ultravioleta do Sol, que é prejudicial à vida.","aquece a Terra durante a noite.","fornece oxigênio para a respiração.","forma as nuvens."],c:1,e:"O ozônio filtra parte da radiação UV, que pode causar câncer de pele e danos aos ecossistemas."},
{a:"HIS",q:"A chegada da família real portuguesa ao Brasil, em 1808, trouxe mudanças como",o:["o fim da escravidão.","a abertura dos portos às nações amigas e a criação de instituições como o Banco do Brasil.","a proclamação da República.","o fim do domínio espanhol.","a expulsão dos jesuítas."],c:1,e:"A corte instalada no Rio de Janeiro abriu os portos e criou o Banco do Brasil, entre outras instituições."},
{a:"HIS",q:"A Proclamação da República, em 15 de novembro de 1889, foi liderada por militares e pôs fim",o:["à escravidão.","ao regime monárquico no Brasil.","ao domínio português.","à ditadura Vargas.","à ditadura militar."],c:1,e:"Deodoro da Fonseca liderou o movimento que derrubou a monarquia de D. Pedro II."},
{a:"HIS",q:"O Estado Novo, instituído por Getúlio Vargas em 1937, caracterizou-se",o:["pelo voto livre e pela atuação de vários partidos.","pela centralização do poder, pela censura e pelo fim das eleições.","pela volta da monarquia.","pelo parlamentarismo.","pela escravidão."],c:1,e:"Foi um regime autoritário, com Congresso fechado, censura e forte controle do Estado."},
{a:"HIS",q:"Entre 1964 e 1985, o Brasil viveu uma ditadura militar. Uma das características desse período foi",o:["a ampla liberdade de imprensa.","as eleições diretas para presidente.","a censura, a perseguição a opositores e os Atos Institucionais.","o fim das Forças Armadas.","o poder do Legislativo sobre o Executivo."],c:2,e:"Os Atos Institucionais ampliaram o poder dos militares; houve censura, repressão e perda de direitos políticos."},
{a:"HIS",q:"O movimento “Diretas Já”, de 1983 e 1984, reivindicava",o:["o fim da escravidão.","a volta da monarquia.","eleições diretas para presidente da República.","a criação da CLT.","a independência do Brasil."],c:2,e:"Milhões de pessoas foram às ruas pedir o voto direto para presidente, no fim da ditadura militar."},
{a:"HIS",q:"O lema da Revolução Francesa, de 1789, era",o:["Ordem e Progresso.","Liberdade, Igualdade e Fraternidade.","Deus, Pátria e Família.","Paz e Terra.","Tempo é dinheiro."],c:1,e:"“Liberdade, Igualdade e Fraternidade” resume os ideais da Revolução."},
{a:"HIS",q:"O estopim da Primeira Guerra Mundial (1914–1918) foi",o:["a queda do Muro de Berlim.","o assassinato do arquiduque Francisco Ferdinando, herdeiro do trono austro-húngaro, em Sarajevo.","o ataque a Pearl Harbor.","a invasão da Polônia pela Alemanha nazista.","a Revolução Russa."],c:1,e:"O atentado de Sarajevo, em 1914, desencadeou as alianças que levaram à guerra."},
{a:"HIS",q:"O Holocausto, ocorrido durante a Segunda Guerra Mundial, foi",o:["uma batalha naval no Pacífico.","o extermínio sistemático de milhões de judeus e de outros grupos pelo regime nazista.","um acordo de paz entre Alemanha e França.","o nome dado ao bombardeio de Londres.","uma greve de trabalhadores."],c:1,e:"O regime nazista assassinou cerca de seis milhões de judeus, além de ciganos, pessoas com deficiência e opositores."},
{a:"HIS",q:"A Guerra Fria (1947–1991) foi uma disputa política, econômica e ideológica entre",o:["Alemanha e Japão.","França e Inglaterra.","China e Índia.","Estados Unidos e União Soviética.","Brasil e Argentina."],c:3,e:"Capitalismo (EUA) × socialismo (URSS), sem um confronto militar direto entre as duas potências."},
{a:"HIS",q:"Na democracia ateniense, os cidadãos participavam diretamente das decisões políticas. Porém, não eram considerados cidadãos",o:["os homens adultos nascidos em Atenas.","as mulheres, os escravizados e os estrangeiros.","os filhos de famílias ricas.","os soldados.","os donos de terras."],c:1,e:"A cidadania era restrita: só homens adultos, livres e nascidos em Atenas votavam."},
{a:"HIS",q:"Na Europa da Idade Média, o feudalismo se caracterizava por",o:["o comércio entre cidades ser a principal atividade.","a terra pertencer aos senhores feudais, e os servos trabalharem nela em troca de proteção.","o poder ser exercido por parlamentos eleitos.","as indústrias dominarem a economia.","a escravidão ter sido abolida."],c:1,e:"Economia rural, baseada na terra e em relações de servidão."},
{a:"HIS",q:"O Renascimento, entre os séculos XIV e XVI, valorizou",o:["o isolamento da vida nos feudos.","o humanismo, a razão e a arte inspirada na Antiguidade clássica.","a produção em fábricas.","o poder absoluto da Igreja sobre a ciência.","a vida em castelos."],c:1,e:"O ser humano passou ao centro do interesse (humanismo), com avanços nas artes e nas ciências."},
{a:"HIS",q:"No Brasil colonial, para a produção de açúcar no Nordeste, os portugueses utilizaram principalmente",o:["o trabalho assalariado de imigrantes europeus.","a mão de obra de africanos escravizados nos engenhos.","máquinas a vapor.","pequenos agricultores livres.","o trabalho voluntário de indígenas pago em dinheiro."],c:1,e:"A economia açucareira se apoiou no trabalho de africanos escravizados."},
{a:"HIS",q:"No fim do século XIX e no início do XX, milhares de imigrantes italianos, japoneses e de outros países vieram trabalhar nas fazendas de café de São Paulo. Um dos motivos foi",o:["a falta de interesse pelo café.","a substituição gradual do trabalho escravo pelo trabalho assalariado.","a proibição da exportação do café.","a ocupação holandesa no Sudeste.","o fim do cultivo do café."],c:1,e:"Com o fim da escravidão (1888), os fazendeiros passaram a recrutar mão de obra imigrante."},
{a:"HIS",q:"Os quilombos, como o de Palmares, liderado por Zumbi, foram",o:["colônias portuguesas.","comunidades formadas por pessoas negras que resistiram à escravidão.","engenhos de açúcar.","missões jesuíticas.","fortes holandeses."],c:1,e:"Quilombos eram espaços de liberdade e resistência de pessoas que fugiam da escravidão."},
{a:"GEO",q:"A linha imaginária que divide a Terra nos hemisférios Norte e Sul é",o:["o Meridiano de Greenwich.","a Linha do Equador.","o Trópico de Capricórnio.","o Círculo Polar Ártico.","o Trópico de Câncer."],c:1,e:"O Equador (latitude 0°) separa os hemisférios Norte e Sul. Greenwich separa Leste e Oeste."},
{a:"GEO",q:"A maior parte do território brasileiro está localizada na zona climática",o:["polar.","intertropical.","temperada do norte.","glacial.","subpolar."],c:1,e:"O Brasil fica, em sua maior parte, entre os trópicos de Câncer e de Capricórnio."},
{a:"GEO",q:"A região brasileira com maior população absoluta é",o:["a Norte.","a Nordeste.","a Sul.","a Sudeste.","a Centro-Oeste."],c:3,e:"O Sudeste concentra cerca de 40% da população do país."},
{a:"GEO",q:"A maior bacia hidrográfica do Brasil, em área, é a",o:["do Rio São Francisco.","do Paraná.","Amazônica.","do Tocantins-Araguaia.","do Paraguai."],c:2,e:"A bacia Amazônica é a maior do país e a maior do mundo em volume de água."},
{a:"GEO",q:"Quando uma cidade cresce sem planejamento, é comum o surgimento de problemas como",o:["o excesso de áreas verdes.","o trânsito intenso, as moradias precárias e a falta de saneamento.","a redução da população.","o aumento das áreas rurais.","a queda da poluição."],c:1,e:"Crescimento desordenado sobrecarrega transporte, moradia e serviços básicos."},
{a:"GEO",q:"Uma pirâmide etária com a base estreita e o topo largo indica uma população",o:["jovem, com alta natalidade.","envelhecida, com baixa natalidade e maior expectativa de vida.","em guerra.","sem idosos.","formada só por crianças."],c:1,e:"Base estreita = poucos nascimentos; topo largo = muitos idosos."},
{a:"GEO",q:"A globalização pode ser definida como",o:["o isolamento entre os países.","a intensificação das trocas econômicas, culturais e de informação entre países.","o fim do comércio internacional.","a divisão do mundo em dois blocos.","o desaparecimento das fronteiras físicas."],c:1,e:"Transportes e comunicações rápidos aproximaram economias e culturas."},
{a:"GEO",q:"No Brasil, a principal fonte de energia usada para gerar eletricidade é",o:["a nuclear.","o carvão mineral.","a hidráulica.","a eólica.","o gás natural."],c:2,e:"As usinas hidrelétricas respondem pela maior parte da eletricidade brasileira."},
{a:"GEO",q:"Em qual das escalas abaixo o mapa mostra uma mesma área com mais detalhes?",o:["1 : 1 000 000","1 : 500 000","1 : 100 000","1 : 10 000","1 : 50 000"],c:3,e:"Quanto menor o denominador, maior a escala e mais detalhes aparecem."},
{a:"GEO",q:"O clima semiárido do sertão nordestino é caracterizado por",o:["chuvas abundantes e bem distribuídas.","chuvas escassas e irregulares e longos períodos de seca.","neve no inverno.","temperaturas baixas o ano todo.","umidade constante."],c:1,e:"Chove pouco e de forma irregular, com temperaturas altas o ano todo."},
{a:"GEO",q:"O desmatamento da Amazônia está ligado principalmente",o:["ao crescimento natural da floresta.","à expansão da pecuária e da agricultura e à extração ilegal de madeira.","à falta de chuva.","ao turismo.","à construção de aeroportos."],c:1,e:"As principais causas são a abertura de pasto, o cultivo agrícola e a exploração ilegal."},
{a:"GEO",q:"A diferença de fuso horário entre dois lugares ocorre porque",o:["a Terra gira em torno do próprio eixo e o Sol ilumina cada lugar em horas diferentes.","a Lua influencia as horas.","a Terra dá uma volta ao redor do Sol a cada dia.","cada país escolhe livremente a hora que quiser.","os relógios atrasam com a distância."],c:0,e:"A rotação da Terra faz o dia amanhecer em momentos diferentes em cada longitude."},
{a:"GEO",q:"O Mercosul é um bloco econômico formado inicialmente por",o:["Brasil, Argentina, Paraguai e Uruguai.","Brasil, México, Canadá e Estados Unidos.","França, Alemanha, Itália e Espanha.","China, Japão, Coreia e Índia.","Brasil, Chile, Peru e Colômbia."],c:0,e:"O Mercado Comum do Sul foi criado em 1991 por esses quatro países."},
{a:"GEO",q:"O fenômeno em que uma camada de ar frio fica presa perto do solo, sob uma camada de ar quente, aumentando a poluição nas grandes cidades, é a",o:["chuva ácida.","maré vermelha.","inversão térmica.","ilha de calor.","erosão eólica."],c:2,e:"Na inversão térmica, o ar frio e poluído não sobe, e os poluentes ficam concentrados perto do chão."},
{a:"GEO",q:"Uma fábrica de automóveis pertence a qual setor da economia?",o:["Primário.","Secundário.","Terciário.","Extrativista.","Informal."],c:1,e:"O setor secundário transforma matérias-primas em produtos industrializados."},
{a:"CID",q:"A Lei Brasileira de Inclusão da Pessoa com Deficiência (Estatuto da Pessoa com Deficiência) tem como objetivo garantir",o:["acessibilidade, direito à educação inclusiva e ao trabalho em igualdade de condições.","a isenção de todos os impostos para qualquer pessoa.","a aposentadoria aos 40 anos para todos.","o direito de não estudar nem trabalhar.","a proibição do uso do transporte público."],c:0,e:"A Lei 13.146/2015 promove a inclusão e a cidadania das pessoas com deficiência."},
{a:"CID",q:"Uma compra de R$ 37,80 foi paga com uma nota de R$ 50,00. O troco correto é",o:["R$ 11,20.","R$ 12,20.","R$ 12,80.","R$ 13,20.","R$ 17,80."],c:1,e:"50,00 − 37,80 = 12,20."},
{a:"CID",q:"A conta de energia de uma casa mostra consumo de 150 kWh, com tarifa de R$ 0,80 por kWh. O valor da energia consumida é",o:["R$ 80,00.","R$ 120,00.","R$ 150,00.","R$ 187,50.","R$ 1.200,00."],c:1,e:"150 × 0,80 = R$ 120,00."},
{a:"CID",q:"Uma TV de R$ 1.800,00 pode ser paga em 12 parcelas iguais, sem juros. Cada parcela será de",o:["R$ 120,00.","R$ 135,00.","R$ 150,00.","R$ 180,00.","R$ 216,00."],c:2,e:"1.800 ÷ 12 = R$ 150,00."},
{a:"CID",q:"A Declaração Universal dos Direitos Humanos, de 1948, afirma que todos os seres humanos nascem",o:["com direitos diferentes, conforme sua origem.","livres e iguais em dignidade e em direitos.","com deveres, mas sem direitos.","submetidos à lei do mais forte.","com direitos apenas se forem cidadãos de países ricos."],c:1,e:"É o princípio do artigo 1º da Declaração."},
{a:"CID",q:"Para combater as fake news (notícias falsas) na internet, o leitor deve",o:["compartilhar rápido, antes que a notícia suma.","confiar em qualquer mensagem enviada por conhecidos.","checar a fonte e procurar a mesma informação em veículos confiáveis.","acreditar nas notícias que confirmam o que já pensa.","ignorar a data da publicação."],c:2,e:"Verificar fonte, data e outras publicações reduz o risco de espalhar desinformação."},
{a:"CID",q:"O Estatuto da Criança e do Adolescente (ECA) determina que é dever da família, da sociedade e do Estado assegurar, com prioridade, direitos como",o:["trabalho em período integral.","saúde, educação e proteção contra a violência.","dirigir veículos.","votar em eleições.","assinar contratos de trabalho."],c:1,e:"O ECA estabelece a proteção integral e a prioridade absoluta à infância e à adolescência."},
{a:"CID",q:"No Brasil, o voto é obrigatório para as pessoas alfabetizadas com idade de",o:["16 a 17 anos.","18 a 70 anos.","mais de 70 anos.","qualquer idade.","apenas homens."],c:1,e:"É facultativo para quem tem 16 ou 17 anos, para os maiores de 70 e para os analfabetos."},
{a:"CID",q:"Os impostos pagos pelos cidadãos devem ser usados pelo governo para",o:["pagar dívidas pessoais dos políticos.","financiar serviços públicos, como saúde, educação e segurança.","comprar bens apenas para empresas privadas.","sustentar apenas as Forças Armadas.","ser guardados e nunca utilizados."],c:1,e:"Os tributos financiam serviços e obras de interesse coletivo."},
{a:"CID",q:"Entre os três erres da sustentabilidade (reduzir, reutilizar e reciclar), “reduzir” significa",o:["jogar menos lixo no mesmo saco.","consumir menos e evitar o desperdício, gerando menos resíduos.","comprar produtos descartáveis.","queimar o lixo.","enterrar os resíduos."],c:1,e:"Reduzir é o primeiro passo: diminuir o consumo e o lixo gerado."},
{a:"CID",t:"Tomar 1 comprimido a cada 8 horas.",f:"Orientação de uma bula de remédio (criada para o simulado).",q:"Seguindo essa orientação, em um dia (24 horas) a pessoa tomará",o:["1 comprimido.","2 comprimidos.","3 comprimidos.","4 comprimidos.","8 comprimidos."],c:2,e:"24 ÷ 8 = 3 comprimidos por dia."}
];
const L="ABCDE", KEY="simuladoEtec1", KEYV="simuladoEtecVistas", LIMITE=4*3600;
/* Prova completa: 50 questões, nesta proporção por matéria. Treino: só uma matéria, quantidade escolhida na tela inicial. */
const COTA={LP:12,MAT:12,CN:9,HIS:6,GEO:6,CID:5};
const NOMES={completa:"Prova completa",...AREAS};
const nBanco=a=>BANCO.filter(q=>q.a===a).length;
let Q=[], qtd=10, tick=null, db=null;
let S=load()||novo(); aplica();
const treino=()=>S.modo!=="completa";
function embaralha(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* memória de quais questões já saíram neste aparelho: o sorteio prefere as que menos apareceram */
function vistas(){try{return JSON.parse(localStorage.getItem(KEYV))||{}}catch(e){return{}}}
function marcaVistas(){const v=vistas();S.ids.forEach(id=>v[id]=(v[id]||0)+1);try{localStorage.setItem(KEYV,JSON.stringify(v))}catch(e){}}
function sorteia(modo){
  const v=vistas(), cota=modo==="completa"?COTA:{[modo]:Math.min(qtd,nBanco(modo))};
  let ids=[];
  for(const a in cota){
    const pool=embaralha(BANCO.map((_,k)=>k).filter(k=>BANCO[k].a===a));
    pool.sort((x,y)=>(v[x]||0)-(v[y]||0)); /* sort estável: empate fica na ordem sorteada */
    ids=ids.concat(pool.slice(0,cota[a]));
  }
  ids=embaralha(ids);
  return{ids,perm:ids.map(()=>embaralha([0,1,2,3,4]))};
}
function novo(modo="completa"){const s=sorteia(modo);return{fase:"inicio",modo,nome:"",i:0,r:Array(s.ids.length).fill(null),tq:Array(s.ids.length).fill(0),seg:0,inicio:null,fim:null,id:null,ids:s.ids,perm:s.perm}}
/* monta as questões da prova atual: ordem sorteada e alternativas embaralhadas */
function aplica(){Q=S.ids.map((id,k)=>{const b=BANCO[id],p=S.perm[k];return{...b,id,o:p.map(j=>b.o[j]),c:p.indexOf(b.c)}})}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&!s.ids){s.ids=s.r.map((_,k)=>k);s.perm=s.r.map(()=>[0,1,2,3,4])}if(s&&!s.modo)s.modo="completa";return s}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hms=s=>{s=Math.max(0,Math.floor(s));return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map((n,k)=>k?String(n).padStart(2,"0"):n).join(":")};
const relogio=()=>treino()?hms(S.seg):hms(LIMITE-S.seg);
const resp=()=>S.r.filter(x=>x!==null).length;

function render(){
  clearInterval(tick);
  if(S.fase==="inicio")return inicio();
  if(S.fase==="prova"){prova();tick=setInterval(()=>{S.seg++;S.tq[S.i]++;const c=$("#clock");if(c)c.textContent=relogio();if(S.seg%5===0)save();if(!treino()&&S.seg>=LIMITE)entregar()},1000);return}
  if(S.fase==="cartao")return cartao();
  resultado();
}
function reinicia(){S=novo();aplica();save();render();scrollTo(0,0)}
function iniciar(modo,nome){
  if(S.modo!==modo||S.inicio){S=novo(modo);aplica()}
  S.nome=nome;S.inicio=new Date().toISOString();S.id=Date.now().toString(36);marcaVistas();S.fase="prova";save();render();scrollTo(0,0);
}
function inicio(){
  const andamento=S.inicio&&resp()>0;
  const areas=Object.keys(AREAS);
  app.innerHTML=`<div class="wrap stack">
  <div class="stack" style="gap:8px"><span class="area" style="align-self:flex-start">Simulado</span>
  <h1>Vestibulinho Etec</h1>
  <p class="muted" style="margin:0">Prova no mesmo formato do processo seletivo para o 1º módulo dos cursos técnicos: questões de múltipla escolha baseadas no conteúdo do Ensino Fundamental II, com textos, tabelas e situações do dia a dia.</p></div>
  <div class="card stack"><div class="stack" style="gap:6px"><label for="nome">Seu nome</label><input id="nome" type="text" autocomplete="name" value="${esc(S.nome)}" placeholder="Ex.: Maria"></div></div>
  ${andamento?`<div class="card stack"><h2>${NOMES[S.modo]} em andamento</h2>
    <span class="muted">${resp()} de ${Q.length} questões respondidas.</span>
    <button class="btn" id="go">Continuar</button>
    <button class="btn ghost" id="zera">Recomeçar do zero</button></div>`:`
  <div class="card stack"><h2>Prova completa</h2>
    <dl class="facts"><div><dt>Questões</dt><dd>${Object.values(COTA).reduce((a,b)=>a+b,0)}</dd></div><div><dt>Alternativas</dt><dd>5 (A a E)</dd></div><div><dt>Tempo</dt><dd>4 horas</dd></div><div><dt>Corretas</dt><dd>1 por questão</dd></div></dl>
    <ul class="muted" style="margin:0;padding-left:20px">
      <li>Faça como no dia da prova: sem consulta, sem calculadora, com papel para rascunho.</li>
      <li>Dá para voltar e trocar respostas antes de entregar.</li>
      <li>O relógio mostra quanto tempo ainda resta.</li>
      <li>Cada prova sorteia questões de um banco de ${BANCO.length}, em ordem diferente e com as alternativas embaralhadas. As que você ainda não viu entram primeiro.</li>
    </ul>
    <button class="btn" id="go">Começar a prova completa</button></div>
  <div class="card stack"><h2>Treinar por matéria</h2>
    <p class="muted" style="margin:0">Treine uma matéria de cada vez antes da prova. Sem relógio: depois de cada resposta você vê o gabarito e a explicação.</p>
    <div class="row" role="group" aria-label="Quantidade de questões do treino">${[10,20].map(n=>`<button class="chip" data-n="${n}" aria-pressed="${qtd===n}">${n} questões</button>`).join("")}</div>
    <div class="grid2">${areas.map(a=>`<button class="btn ghost treina" data-m="${a}"><span>${AREAS[a]}</span><span class="sub muted">${Math.min(qtd,nBanco(a))} questões · banco de ${nBanco(a)}</span></button>`).join("")}</div>
  </div>`}
  </div>`;
  const nome=()=>$("#nome").value.trim();
  $("#go").onclick=()=>{if(andamento){S.nome=nome();S.fase="prova";save();render();scrollTo(0,0)}else iniciar("completa",nome())};
  if($("#zera"))$("#zera").onclick=reinicia;
  app.querySelectorAll(".treina").forEach(b=>b.onclick=()=>iniciar(b.dataset.m,nome()));
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.nome=nome();qtd=+b.dataset.n;inicio()});
}
function prova(){
  const q=Q[S.i], fb=treino()&&S.r[S.i]!==null, ok=S.r[S.i]===q.c;
  app.innerHTML=`<div class="bar"><div class="in"><span class="qnum">Questão ${S.i+1} <span class="muted">/ ${Q.length}</span></span>
  <span class="clock" aria-label="${treino()?"tempo de treino":"tempo restante"}" id="clock">${relogio()}</span>
  <button class="btn ghost" id="vercartao" style="padding:8px 12px">Cartão</button></div>
  <div class="prog"><i style="width:${resp()/Q.length*100}%"></i></div></div>
  <div class="wrap stack">
    <span class="area" style="align-self:flex-start">${AREAS[q.a]}${treino()?" · treino":""}</span>
    ${q.t?`<div class="texto">${esc(q.t)}</div>${q.f?`<div class="fonte">${esc(q.f)}</div>`:""}`:""}
    <p style="margin:0;font-weight:500">${esc(q.q)}</p>
    <ul class="alts">${q.o.map((o,k)=>{const cls=fb?(k===q.c?" certa":(k===S.r[S.i]?" errada":"")):"";return`<li><button class="alt${cls}" data-k="${k}" aria-pressed="${S.r[S.i]===k}"${fb?" disabled":""}><span class="b">${L[k]}</span><span>${esc(o)}</span></button></li>`}).join("")}</ul>
    ${fb?`<div class="card stack" id="fb" style="gap:6px"><b class="tag ${ok?"ok":"no"}">${ok?"Acertou!":"Não foi dessa vez."}</b>${ok?"":`<span>Resposta certa: <b>${L[q.c]}) ${esc(q.o[q.c])}</b></span>`}<span class="muted">${esc(q.e)}</span></div>`:""}
  </div>
  <div class="nav"><div class="in"><button class="btn ghost" id="ant" ${S.i===0?"disabled":""}>Anterior</button>
  ${S.i<Q.length-1?`<button class="btn" id="prox">Próxima</button>`:`<button class="btn" id="fim">${treino()?"Ver resultado":"Revisar e entregar"}</button>`}</div></div>`;
  app.querySelectorAll(".alt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(treino()){if(S.r[S.i]!==null)return;S.r[S.i]=k;save();prova();const f=$("#fb");if(f)f.scrollIntoView({block:"nearest",behavior:"smooth"});return}
    S.r[S.i]=S.r[S.i]===k?null:k;save();app.querySelectorAll(".alt").forEach(x=>x.setAttribute("aria-pressed",S.r[S.i]===+x.dataset.k));$(".prog i").style.width=resp()/Q.length*100+"%"
  });
  $("#ant").onclick=()=>ir(S.i-1);
  if($("#prox"))$("#prox").onclick=()=>ir(S.i+1);
  if($("#fim"))$("#fim").onclick=()=>{S.fase="cartao";save();render();scrollTo(0,0)};
  $("#vercartao").onclick=()=>{S.fase="cartao";save();render();scrollTo(0,0)};
}
function ir(i){S.i=i;save();render();scrollTo(0,0)}
function cartao(){
  const falta=Q.length-resp();
  app.innerHTML=`<div class="wrap stack"><h2>Cartão-resposta</h2>
  <p class="muted" style="margin:0">Toque num número para voltar à questão. ${treino()?`Tempo de treino: ${hms(S.seg)}.`:`Restam ${hms(LIMITE-S.seg)} de prova.`}</p>
  <div class="grid">${Q.map((_,k)=>`<button class="cell ${S.r[k]!==null?"on":""} ${k===S.i?"cur":""}" data-k="${k}">${k+1}${S.r[k]!==null?" "+L[S.r[k]]:""}</button>`).join("")}</div>
  ${falta?`<div class="warn">Faltam <b>${falta}</b> questões sem resposta. Questão em branco conta como erro.</div>`:""}
  <div class="row"><button class="btn ghost" id="volta">Voltar à prova</button><button class="btn" id="entrega">${treino()?"Finalizar treino":"Entregar a prova"}</button></div>
  <div id="conf"></div></div>`;
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{S.fase="prova";ir(+b.dataset.k)});
  $("#volta").onclick=()=>{S.fase="prova";save();render()};
  $("#entrega").onclick=()=>{$("#conf").innerHTML=`<div class="card stack"><b>${treino()?"Finalizar o treino agora?":"Entregar agora?"}</b><span class="muted">Depois de ${treino()?"finalizar":"entregar"} não dá para mudar as respostas.</span><div class="row"><button class="btn" id="sim">${treino()?"Sim, finalizar":"Sim, entregar"}</button><button class="btn ghost" id="nao">Ainda não</button></div></div>`;$("#sim").onclick=entregar;$("#nao").onclick=()=>$("#conf").innerHTML="";$("#sim").focus()};
}
function entregar(){S.fase="fim";S.fim=new Date().toISOString();save();enviar();render();scrollTo(0,0)}
function dados(){
  const itens=Q.map((q,k)=>({n:k+1,q:q.id+1,area:AREAS[q.a],marcada:S.r[k]===null?null:L[S.r[k]],correta:L[q.c],acertou:S.r[k]===q.c,tempoSeg:S.tq[k]}));
  return{nome:S.nome||"(sem nome)",modo:S.modo,inicio:S.inicio,fim:S.fim,duracaoSeg:S.seg,acertos:itens.filter(x=>x.acertou).length,total:Q.length,itens};
}
function texto(){
  const d=dados();
  return `Simulado Etec · ${NOMES[d.modo]} · ${d.nome}\nAcertos: ${d.acertos}/${d.total} · Tempo: ${hms(d.duracaoSeg)}\n`+d.itens.map(x=>`${x.n} (q${x.q}) ${x.marcada||"-"}${x.acertou?"✓":"✗"+x.correta} ${x.tempoSeg}s`).join("\n");
}
async function enviar(){return;
  try{db=db||await window.claude?.use?.("db");if(!db)return;await db.collection("tentativas").doc(S.id||Date.now().toString(36)).set(dados());const s=$("#salvo");if(s)s.textContent="Respostas salvas online."}catch(e){}
}
function resultado(){
  const d=dados(),pct=Math.round(d.acertos/d.total*100);
  const porArea=Object.values(AREAS).map(a=>{const it=d.itens.filter(x=>x.area===a);return{a,ok:it.filter(x=>x.acertou).length,n:it.length}}).filter(p=>p.n>0);
  app.innerHTML=`<div class="wrap stack">
  <div class="card stack"><span class="muted">${esc(d.nome)} · ${treino()?`treino de ${esc(NOMES[d.modo])} finalizado`:"prova entregue"}</span>
  <div><span class="big">${d.acertos}</span><span class="muted"> de ${d.total} acertos (${pct}%)</span></div>
  <span class="muted">Tempo usado: ${hms(d.duracaoSeg)}${treino()?"":" de 4:00:00"}</span>

  <div class="row"><a class="btn" id="zap" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Enviar pelo WhatsApp</a><button class="btn ghost" id="copiar">Copiar respostas</button><button class="btn ghost" id="refazer">Novo simulado ou treino</button></div>
  <span class="muted" id="cmsg" style="font-size:.9rem">Copie e mande para quem vai analisar o resultado.</span>
  <textarea id="txt" readonly hidden style="width:100%;min-height:120px;font:inherit;font-size:.85rem"></textarea></div>
  <div class="card"><table><thead><tr><th>Área</th><th>Acertos</th></tr></thead><tbody>${porArea.map(p=>`<tr><td>${p.a}</td><td>${p.ok}/${p.n}</td></tr>`).join("")}</tbody></table></div>
  <h2>Correção</h2>
  <div class="grid">${d.itens.map(x=>`<a class="cell ${x.acertou?"ok":"no"}" href="#q${x.n}" style="text-align:center;text-decoration:none">${x.n}</a>`).join("")}</div>
  ${Q.map((q,k)=>{const x=d.itens[k];return`<div class="rev stack" id="q${k+1}" style="gap:6px"><b>Questão ${k+1} <span class="muted" style="font-weight:400">· ${AREAS[q.a]}</span></b>
  <span>${esc(q.q)}</span>
  <span>Sua resposta: <span class="tag ${x.acertou?"ok":"no"}">${x.marcada?x.marcada+") "+esc(q.o[S.r[k]]):"em branco"}</span></span>
  ${x.acertou?"":`<span>Correta: <span class="tag ok">${x.correta}) ${esc(q.o[q.c])}</span></span>`}
  <span class="muted">${esc(q.e)}</span></div>`}).join("")}
  </div>`;
  $("#zap").href="https://wa.me/?text="+encodeURIComponent(texto());$("#copiar").onclick=()=>{const t=texto();navigator.clipboard.writeText(t).then(()=>$("#cmsg").textContent="Copiado! Agora é só colar no WhatsApp.").catch(()=>{const a=$("#txt");a.hidden=false;a.value=t;a.select();$("#cmsg").textContent="Selecione o texto abaixo e copie."})};
  $("#refazer").onclick=()=>{$("#cmsg").innerHTML=`Isso apaga o resultado atual deste aparelho. <button class="btn ghost" id="ok2" style="padding:6px 10px">Apagar e voltar ao início</button>`;$("#ok2").onclick=reinicia};
}
render();
</script>
</body>
</html>
